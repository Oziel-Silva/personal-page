name: personal-page

services:
  personal-page:
    image: ghcr.io/oziel-silva/personal-page:0.0.4
    build: ./site
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    user: "0:0"
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared
    command: tunnel --config /home/nonroot/.cloudflared/config.yml run
    depends_on:
      - personal-page
    restart: unless-stopped
